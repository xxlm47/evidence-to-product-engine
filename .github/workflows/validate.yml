name: Validate Evidence-to-Product Engine

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate structure
        run: bash scripts/validate-project.sh
      - name: Check JSON configuration
        run: python -m json.tool config/settings.json >/dev/null
      - name: Check browser JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          html = Path("app/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script\s*>", html, flags=re.I | re.S)
          if not scripts:
              raise SystemExit("No inline JavaScript found in app/index.html")
          Path("/tmp/evidence-to-product-app.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/evidence-to-product-app.js
