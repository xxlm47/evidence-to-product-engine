name: Validate Evidence-to-Product Engine

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate structure
        run: bash scripts/validate-project.sh
      - name: Check JSON configuration
        run: python -m json.tool config/settings.json >/dev/null
